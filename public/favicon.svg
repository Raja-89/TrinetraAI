<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#0D1117" />
  
  <!-- Outer Eye Shape -->
  <path d="M 15 50 Q 50 15 85 50 Q 50 85 15 50 Z" fill="rgba(82,39,255,0.15)" stroke="#5227FF" stroke-width="7" stroke-linejoin="round" />
  
  <!-- Inner Iris (Teal) -->
  <circle cx="50" cy="50" r="18" fill="#00B3A4" />
  
  <!-- Pupil (Dark) -->
  <circle cx="50" cy="50" r="7" fill="#0D1117" />
  
  <!-- High-tech crosshair/lens flare detail -->
  <line x1="50" y1="20" x2="50" y2="30" stroke="#5227FF" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="70" x2="50" y2="80" stroke="#5227FF" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="50" x2="30" y2="50" stroke="#5227FF" stroke-width="3" stroke-linecap="round" />
  <line x1="70" y1="50" x2="80" y2="50" stroke="#5227FF" stroke-width="3" stroke-linecap="round" />
</svg>
